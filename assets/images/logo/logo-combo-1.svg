<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80">
  <defs>
    <linearGradient id="goldC1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0d860"/>
      <stop offset="100%" style="stop-color:#c9a227"/>
    </linearGradient>
  </defs>

  <!-- Dark Background -->
  <rect width="340" height="80" rx="6" fill="#0a0a0a"/>

  <!-- Combo 1: Briefcase front + Shopping bag back -->
  <g transform="translate(6, 10)">
    <!-- Back: Shopping bag (like C-16 style) -->
    <rect x="30" y="18" width="30" height="38" rx="3" fill="url(#goldC1)" opacity="0.12"/>
    <rect x="30" y="18" width="30" height="38" rx="3" fill="none" stroke="url(#goldC1)" stroke-width="2"/>
    <path d="M38 18 L38 10 C38 6 41 4 45 4 C49 4 52 6 52 10 L52 18" fill="none" stroke="url(#goldC1)" stroke-width="2" stroke-linecap="round"/>

    <!-- Front: Briefcase (C-14 style) -->
    <rect x="4" y="20" width="44" height="34" rx="3" fill="url(#goldC1)" opacity="0.2"/>
    <rect x="4" y="20" width="44" height="34" rx="3" fill="none" stroke="url(#goldC1)" stroke-width="3"/>
    <path d="M18 20 L18 12 L34 12 L34 20" fill="none" stroke="url(#goldC1)" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="38" x2="42" y2="38" stroke="url(#goldC1)" stroke-width="2"/>
    <circle cx="23" cy="38" r="2" fill="url(#goldC1)"/>
    <circle cx="29" cy="38" r="2" fill="url(#goldC1)"/>
  </g>

  <!-- Text: SagarBags -->
  <text x="78" y="50" font-family="Poppins, sans-serif" font-size="32" font-weight="600" fill="#ffffff">Sagar<tspan fill="url(#goldC1)" font-weight="700">Bags</tspan></text>
</svg>
