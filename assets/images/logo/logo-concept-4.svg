<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60">
  <defs>
    <linearGradient id="goldGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8c547"/>
      <stop offset="50%" style="stop-color:#c9a227"/>
      <stop offset="100%" style="stop-color:#a68b1f"/>
    </linearGradient>
  </defs>

  <!-- Diamond/Shield Badge with SB -->
  <g transform="translate(3, 2)">
    <!-- Diamond Shape -->
    <path d="M25 3 L45 28 L25 53 L5 28 Z"
          fill="url(#goldGrad4)" opacity="0.1"/>
    <path d="M25 3 L45 28 L25 53 L5 28 Z"
          fill="none" stroke="url(#goldGrad4)" stroke-width="2" stroke-linejoin="round"/>

    <!-- SB Letters stacked -->
    <text x="25" y="25" font-family="Poppins, sans-serif" font-size="13" font-weight="700" fill="url(#goldGrad4)" text-anchor="middle">S</text>
    <text x="25" y="40" font-family="Poppins, sans-serif" font-size="13" font-weight="700" fill="url(#goldGrad4)" text-anchor="middle">B</text>
  </g>

  <!-- Text: Sagar -->
  <text x="58" y="38" font-family="Poppins, sans-serif" font-size="28" font-weight="600" fill="#ffffff">Sagar</text>

  <!-- Text: Bags -->
  <text x="150" y="38" font-family="Poppins, sans-serif" font-size="28" font-weight="700" fill="url(#goldGrad4)">Bags</text>
</svg>
