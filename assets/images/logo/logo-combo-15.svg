<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80">
  <defs>
    <linearGradient id="goldC15" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0d860"/>
      <stop offset="100%" style="stop-color:#c9a227"/>
    </linearGradient>
    <radialGradient id="glow15" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#f0d860" stop-opacity="0.3"/>
      <stop offset="100%" style="stop-color:#c9a227" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Dark Background -->
  <rect width="340" height="80" rx="6" fill="#0a0a0a"/>

  <!-- Combo 15: Geometric Art Deco -->
  <g transform="translate(6, 6)">
    <!-- Outer geometric frame -->
    <polygon points="32,2 58,14 58,54 32,66 6,54 6,14" fill="none" stroke="url(#goldC15)" stroke-width="1.5" opacity="0.4"/>

    <!-- Inner geometric frame -->
    <polygon points="32,10 50,18 50,50 32,58 14,50 14,18" fill="none" stroke="url(#goldC15)" stroke-width="2" opacity="0.6"/>

    <!-- Art deco bag center -->
    <rect x="20" y="22" width="24" height="28" fill="url(#goldC15)" opacity="0.2"/>
    <rect x="20" y="22" width="24" height="28" fill="none" stroke="url(#goldC15)" stroke-width="2.5"/>

    <!-- Art deco handle -->
    <path d="M26 22 L26 14 L38 14 L38 22" fill="none" stroke="url(#goldC15)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Deco lines inside -->
    <line x1="24" y1="32" x2="40" y2="32" stroke="url(#goldC15)" stroke-width="2"/>
    <line x1="24" y1="38" x2="40" y2="38" stroke="url(#goldC15)" stroke-width="1" opacity="0.5"/>
    <line x1="24" y1="42" x2="40" y2="42" stroke="url(#goldC15)" stroke-width="1" opacity="0.5"/>

    <!-- Corner accents -->
    <circle cx="6" cy="14" r="2" fill="url(#goldC15)"/>
    <circle cx="58" cy="14" r="2" fill="url(#goldC15)"/>
    <circle cx="6" cy="54" r="2" fill="url(#goldC15)"/>
    <circle cx="58" cy="54" r="2" fill="url(#goldC15)"/>

    <!-- Glow effect -->
    <ellipse cx="32" cy="36" rx="20" ry="24" fill="url(#glow15)"/>
  </g>

  <!-- Text: SagarBags -->
  <text x="78" y="50" font-family="Poppins, sans-serif" font-size="32" font-weight="600" fill="#ffffff">Sagar<tspan fill="url(#goldC15)" font-weight="700">Bags</tspan></text>
</svg>
