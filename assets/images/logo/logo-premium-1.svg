<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 90" width="360" height="90">
  <defs>
    <linearGradient id="goldPremium1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f4e4a6"/>
      <stop offset="25%" style="stop-color:#e8c547"/>
      <stop offset="50%" style="stop-color:#c9a227"/>
      <stop offset="75%" style="stop-color:#b8960f"/>
      <stop offset="100%" style="stop-color:#a68b1f"/>
    </linearGradient>
    <linearGradient id="goldShine1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fff9e6"/>
      <stop offset="50%" style="stop-color:#c9a227"/>
      <stop offset="100%" style="stop-color:#8b7355"/>
    </linearGradient>
  </defs>

  <!-- Dark Background -->
  <rect x="0" y="0" width="360" height="90" rx="6" fill="#0a0a0a"/>

  <!-- THE CONCEPT: Letter S elegantly morphing into a bag handle -->
  <g transform="translate(18, 10)">
    <!-- Outer elegant border -->
    <rect x="2" y="2" width="66" height="66" rx="8" fill="none" stroke="url(#goldPremium1)" stroke-width="1.5" opacity="0.4"/>

    <!-- The S that becomes a handle - SIGNATURE ELEMENT -->
    <path d="M25 15
             C18 15 14 20 14 26
             C14 32 18 35 25 37
             C32 39 38 42 38 50
             C38 58 32 62 25 62
             C18 62 14 58 14 52"
          fill="none" stroke="url(#goldShine1)" stroke-width="5" stroke-linecap="round"/>

    <!-- Bag body emerging from S -->
    <path d="M38 50 L38 62 C38 66 42 68 48 68 L56 68 C60 68 62 66 62 62 L62 42 C62 38 58 35 52 35 L38 35"
          fill="url(#goldPremium1)" opacity="0.15"/>
    <path d="M38 50 L38 62 C38 66 42 68 48 68 L56 68 C60 68 62 66 62 62 L62 42 C62 38 58 35 52 35 L44 35"
          fill="none" stroke="url(#goldPremium1)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Handle completing the visual -->
    <path d="M48 35 C48 28 52 25 56 25 C60 25 62 28 62 32"
          fill="none" stroke="url(#goldPremium1)" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Text: SagarBags - Premium Typography -->
  <text x="105" y="52" font-family="Poppins, sans-serif" font-size="32" font-weight="600" fill="#ffffff" letter-spacing="1">Sagar<tspan fill="url(#goldPremium1)" font-weight="700">Bags</tspan></text>

  <!-- Tagline -->
  <text x="107" y="70" font-family="Poppins, sans-serif" font-size="9" fill="#666" letter-spacing="3" text-transform="uppercase">CRAFTING EXCELLENCE SINCE 2004</text>
</svg>
