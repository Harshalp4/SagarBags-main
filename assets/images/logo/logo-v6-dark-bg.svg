<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="gold6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8c547"/>
      <stop offset="50%" style="stop-color:#c9a227"/>
      <stop offset="100%" style="stop-color:#a68b1f"/>
    </linearGradient>
  </defs>

  <!-- Dark Background -->
  <rect x="0" y="0" width="320" height="80" rx="8" fill="#0a0a0a"/>

  <!-- Abstract Folded Bag / Origami Style -->
  <g transform="translate(10, 8)">
    <!-- Main diamond/folded shape -->
    <path d="M32 4 L56 32 L32 60 L8 32 Z"
          fill="url(#gold6)" opacity="0.15"/>
    <path d="M32 4 L56 32 L32 60 L8 32 Z"
          fill="none" stroke="url(#gold6)" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Inner fold lines -->
    <path d="M32 4 L32 32 M8 32 L32 32 M56 32 L32 32 M32 60 L32 32"
          stroke="url(#gold6)" stroke-width="1" opacity="0.4"/>

    <!-- Center accent -->
    <circle cx="32" cy="32" r="8" fill="none" stroke="url(#gold6)" stroke-width="2"/>
    <circle cx="32" cy="32" r="3" fill="url(#gold6)"/>
  </g>

  <!-- Text: SagarBags -->
  <text x="78" y="48" font-family="Poppins, sans-serif" font-size="30" font-weight="600" fill="#ffffff">Sagar<tspan fill="url(#gold6)" font-weight="700">Bags</tspan></text>
</svg>
