<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80">
  <defs>
    <linearGradient id="goldC7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0d860"/>
      <stop offset="100%" style="stop-color:#c9a227"/>
    </linearGradient>
  </defs>

  <!-- Dark Background -->
  <rect width="340" height="80" rx="6" fill="#0a0a0a"/>

  <!-- Combo 7: Briefcase forming letter S -->
  <g transform="translate(10, 10)">
    <!-- S-shaped arrangement of bags -->
    <!-- Top bag (small) -->
    <rect x="30" y="4" width="24" height="18" rx="2" fill="url(#goldC7)" opacity="0.15"/>
    <rect x="30" y="4" width="24" height="18" rx="2" fill="none" stroke="url(#goldC7)" stroke-width="2"/>
    <path d="M38 4 L38 0 L46 0 L46 4" fill="none" stroke="url(#goldC7)" stroke-width="2" stroke-linecap="round"/>

    <!-- Middle bag (briefcase - larger) -->
    <rect x="8" y="20" width="36" height="24" rx="3" fill="url(#goldC7)" opacity="0.25"/>
    <rect x="8" y="20" width="36" height="24" rx="3" fill="none" stroke="url(#goldC7)" stroke-width="3"/>
    <path d="M18 20 L18 14 L34 14 L34 20" fill="none" stroke="url(#goldC7)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="12" y1="34" x2="40" y2="34" stroke="url(#goldC7)" stroke-width="2"/>
    <circle cx="24" cy="34" r="2" fill="url(#goldC7)"/>
    <circle cx="28" cy="34" r="2" fill="url(#goldC7)"/>

    <!-- Bottom bag (small) -->
    <rect x="30" y="42" width="24" height="18" rx="2" fill="url(#goldC7)" opacity="0.15"/>
    <rect x="30" y="42" width="24" height="18" rx="2" fill="none" stroke="url(#goldC7)" stroke-width="2"/>
    <path d="M38 42 L38 38 L46 38 L46 42" fill="none" stroke="url(#goldC7)" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Text: SagarBags -->
  <text x="82" y="50" font-family="Poppins, sans-serif" font-size="32" font-weight="600" fill="#ffffff">Sagar<tspan fill="url(#goldC7)" font-weight="700">Bags</tspan></text>
</svg>
