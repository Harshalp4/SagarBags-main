<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 90" width="360" height="90">
  <defs>
    <linearGradient id="goldPremium4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#faf0c8"/>
      <stop offset="30%" style="stop-color:#e8c547"/>
      <stop offset="70%" style="stop-color:#c9a227"/>
      <stop offset="100%" style="stop-color:#8b7722"/>
    </linearGradient>
  </defs>

  <!-- Dark Background -->
  <rect x="0" y="0" width="360" height="90" rx="6" fill="#0a0a0a"/>

  <!-- THE CONCEPT: Woven/Stitched pattern suggesting craftsmanship -->
  <g transform="translate(12, 10)">
    <!-- Main shield/crest shape -->
    <path d="M35 4 L62 14 L62 45 C62 58 35 68 35 68 C35 68 8 58 8 45 L8 14 Z"
          fill="url(#goldPremium4)" opacity="0.08"/>
    <path d="M35 4 L62 14 L62 45 C62 58 35 68 35 68 C35 68 8 58 8 45 L8 14 Z"
          fill="none" stroke="url(#goldPremium4)" stroke-width="2.5"/>

    <!-- Inner shield -->
    <path d="M35 12 L54 19 L54 42 C54 52 35 60 35 60 C35 60 16 52 16 42 L16 19 Z"
          fill="none" stroke="url(#goldPremium4)" stroke-width="1" opacity="0.5"/>

    <!-- Stitching pattern - represents craftsmanship -->
    <path d="M22 25 L28 25 M32 25 L38 25 M42 25 L48 25"
          stroke="url(#goldPremium4)" stroke-width="2" stroke-linecap="round"/>
    <path d="M22 33 L28 33 M32 33 L38 33 M42 33 L48 33"
          stroke="url(#goldPremium4)" stroke-width="2" stroke-linecap="round"/>
    <path d="M25 41 L31 41 M35 41 L41 41"
          stroke="url(#goldPremium4)" stroke-width="2" stroke-linecap="round"/>

    <!-- Central S -->
    <text x="35" y="55" font-family="Poppins, sans-serif" font-size="16" font-weight="700" fill="url(#goldPremium4)" text-anchor="middle">S</text>
  </g>

  <!-- Text -->
  <text x="90" y="50" font-family="Poppins, sans-serif" font-size="34" font-weight="600" fill="#ffffff">Sagar<tspan fill="url(#goldPremium4)" font-weight="700">Bags</tspan></text>

  <!-- Quality mark -->
  <g transform="translate(285, 30)">
    <circle cx="20" cy="20" r="18" fill="none" stroke="url(#goldPremium4)" stroke-width="1.5"/>
    <text x="20" y="18" font-family="Poppins, sans-serif" font-size="7" fill="url(#goldPremium4)" text-anchor="middle">QUALITY</text>
    <text x="20" y="27" font-family="Poppins, sans-serif" font-size="7" fill="url(#goldPremium4)" text-anchor="middle">ASSURED</text>
  </g>
</svg>
