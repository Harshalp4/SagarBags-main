<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80">
  <defs>
    <linearGradient id="goldC17" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0d860"/>
      <stop offset="100%" style="stop-color:#c9a227"/>
    </linearGradient>
    <linearGradient id="goldC17dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b6914"/>
      <stop offset="100%" style="stop-color:#5c4a0f"/>
    </linearGradient>
  </defs>

  <!-- Dark Background -->
  <rect width="340" height="80" rx="6" fill="#0a0a0a"/>

  <!-- Combo 17: 3D Isometric Bag -->
  <g transform="translate(8, 8)">
    <!-- 3D Isometric bag - back face -->
    <polygon points="32,8 56,18 56,52 32,62" fill="url(#goldC17dark)" opacity="0.4"/>

    <!-- 3D Isometric bag - side face -->
    <polygon points="8,18 32,8 32,62 8,52" fill="url(#goldC17)" opacity="0.25"/>

    <!-- 3D Isometric bag - top face -->
    <polygon points="8,18 32,8 56,18 32,28" fill="url(#goldC17)" opacity="0.5"/>

    <!-- Front face -->
    <polygon points="8,18 32,28 32,62 8,52" fill="none" stroke="url(#goldC17)" stroke-width="2.5"/>
    <polygon points="32,28 56,18 56,52 32,62" fill="none" stroke="url(#goldC17)" stroke-width="2"/>
    <polygon points="8,18 32,8 56,18 32,28" fill="none" stroke="url(#goldC17)" stroke-width="2"/>

    <!-- Handle 3D -->
    <path d="M18 18 L18 6 Q18 2 24 0 L40 0 Q46 2 46 6 L46 18" fill="none" stroke="url(#goldC17)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Zipper line on front -->
    <line x1="14" y1="38" x2="26" y2="44" stroke="url(#goldC17)" stroke-width="2"/>
    <circle cx="20" cy="41" r="2" fill="url(#goldC17)"/>
  </g>

  <!-- Text: SagarBags -->
  <text x="78" y="50" font-family="Poppins, sans-serif" font-size="32" font-weight="600" fill="#ffffff">Sagar<tspan fill="url(#goldC17)" font-weight="700">Bags</tspan></text>
</svg>
