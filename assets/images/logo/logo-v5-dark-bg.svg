<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="gold5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8c547"/>
      <stop offset="50%" style="stop-color:#c9a227"/>
      <stop offset="100%" style="stop-color:#a68b1f"/>
    </linearGradient>
  </defs>

  <!-- Dark Background -->
  <rect x="0" y="0" width="320" height="80" rx="8" fill="#0a0a0a"/>

  <!-- Luxury Handbag Silhouette -->
  <g transform="translate(8, 8)">
    <!-- Bag Body - Structured handbag style -->
    <path d="M10 28 L10 54 C10 56 11 57 13 57 L51 57 C53 57 54 56 54 54 L54 28 C54 26 53 25 51 25 L13 25 C11 25 10 26 10 28 Z"
          fill="url(#gold5)" opacity="0.2"/>
    <path d="M10 28 L10 54 C10 56 11 57 13 57 L51 57 C53 57 54 56 54 54 L54 28 C54 26 53 25 51 25 L13 25 C11 25 10 26 10 28 Z"
          fill="none" stroke="url(#gold5)" stroke-width="2.5"/>

    <!-- Handle -->
    <path d="M22 25 L22 12 C22 8 27 5 32 5 C37 5 42 8 42 12 L42 25"
          fill="none" stroke="url(#gold5)" stroke-width="3" stroke-linecap="round"/>

    <!-- Clasp/Lock detail -->
    <rect x="27" y="32" width="10" height="8" rx="2" fill="none" stroke="url(#gold5)" stroke-width="1.5"/>
    <circle cx="32" cy="36" r="2" fill="url(#gold5)"/>

    <!-- Bottom accent line -->
    <path d="M15 50 L49 50" stroke="url(#gold5)" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Text: SagarBags -->
  <text x="78" y="48" font-family="Poppins, sans-serif" font-size="30" font-weight="600" fill="#ffffff">Sagar<tspan fill="url(#gold5)" font-weight="700">Bags</tspan></text>
</svg>
