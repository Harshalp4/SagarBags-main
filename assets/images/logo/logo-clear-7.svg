<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80">
  <defs>
    <linearGradient id="gold7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0d860"/>
      <stop offset="100%" style="stop-color:#c9a227"/>
    </linearGradient>
  </defs>

  <!-- Dark Background -->
  <rect width="340" height="80" rx="6" fill="#0a0a0a"/>

  <!-- Gift Bag with Tag -->
  <g transform="translate(10, 8)">
    <!-- Bag Body -->
    <rect x="10" y="22" width="44" height="42" rx="3" fill="url(#gold7)" opacity="0.2"/>
    <rect x="10" y="22" width="44" height="42" rx="3" fill="none" stroke="url(#gold7)" stroke-width="3"/>

    <!-- Handles -->
    <path d="M22 22 L22 12 C22 8 27 5 32 5 C37 5 42 8 42 12 L42 22"
          fill="none" stroke="url(#gold7)" stroke-width="3" stroke-linecap="round"/>

    <!-- Ribbon/Bow -->
    <line x1="32" y1="22" x2="32" y2="42" stroke="url(#gold7)" stroke-width="2"/>
    <circle cx="32" cy="32" r="6" fill="url(#gold7)" opacity="0.3"/>
    <circle cx="32" cy="32" r="6" fill="none" stroke="url(#gold7)" stroke-width="2"/>
  </g>

  <!-- Text: SagarBags -->
  <text x="78" y="50" font-family="Poppins, sans-serif" font-size="32" font-weight="600" fill="#ffffff">Sagar<tspan fill="url(#gold7)" font-weight="700">Bags</tspan></text>
</svg>
