<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 90" width="360" height="90">
  <defs>
    <linearGradient id="goldPremium2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f4e4a6"/>
      <stop offset="30%" style="stop-color:#e8c547"/>
      <stop offset="60%" style="stop-color:#c9a227"/>
      <stop offset="100%" style="stop-color:#a68b1f"/>
    </linearGradient>
  </defs>

  <!-- Dark Background -->
  <rect x="0" y="0" width="360" height="90" rx="6" fill="#0a0a0a"/>

  <!-- THE CONCEPT: Interlocking SB forming an abstract bag shape -->
  <g transform="translate(15, 8)">
    <!-- Circular badge base -->
    <circle cx="37" cy="37" r="34" fill="none" stroke="url(#goldPremium2)" stroke-width="2"/>
    <circle cx="37" cy="37" r="28" fill="url(#goldPremium2)" opacity="0.08"/>

    <!-- Stylized S - Left side -->
    <path d="M24 22 C24 18 28 16 33 16 C38 16 42 18 42 22 C42 26 38 28 33 30 C28 32 24 34 24 38"
          fill="none" stroke="url(#goldPremium2)" stroke-width="4" stroke-linecap="round"/>

    <!-- Stylized B - Right side, interlocking -->
    <path d="M24 38 C24 42 28 44 33 44 C38 44 42 42 42 38 C42 34 38 32 33 32"
          fill="none" stroke="url(#goldPremium2)" stroke-width="4" stroke-linecap="round"/>
    <path d="M33 44 L33 58 C40 58 48 54 48 46 C48 40 44 38 40 38"
          fill="none" stroke="url(#goldPremium2)" stroke-width="4" stroke-linecap="round"/>
    <path d="M33 32 C33 26 38 22 44 22 C50 22 50 28 50 32 C50 36 48 38 44 38"
          fill="none" stroke="url(#goldPremium2)" stroke-width="3" stroke-linecap="round"/>

    <!-- Crown accent on top - Heritage symbol -->
    <path d="M28 8 L30 4 L33 7 L36 4 L38 8"
          fill="none" stroke="url(#goldPremium2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
  </g>

  <!-- Text -->
  <text x="100" y="52" font-family="Poppins, sans-serif" font-size="32" font-weight="600" fill="#ffffff" letter-spacing="0.5">Sagar<tspan fill="url(#goldPremium2)" font-weight="700">Bags</tspan></text>

  <!-- Tagline with decorative lines -->
  <line x1="100" y1="66" x2="130" y2="66" stroke="url(#goldPremium2)" stroke-width="1" opacity="0.5"/>
  <text x="138" y="70" font-family="Poppins, sans-serif" font-size="8" fill="#888" letter-spacing="2">EST. 2004</text>
  <line x1="195" y1="66" x2="225" y2="66" stroke="url(#goldPremium2)" stroke-width="1" opacity="0.5"/>
</svg>
