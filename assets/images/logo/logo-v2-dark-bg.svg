<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="gold2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8c547"/>
      <stop offset="50%" style="stop-color:#c9a227"/>
      <stop offset="100%" style="stop-color:#a68b1f"/>
    </linearGradient>
  </defs>

  <!-- Dark Background -->
  <rect x="0" y="0" width="320" height="80" rx="8" fill="#0a0a0a"/>

  <!-- Hexagon Badge with S -->
  <g transform="translate(12, 8)">
    <!-- Hexagon -->
    <polygon points="28,4 50,16 50,40 28,52 6,40 6,16"
             fill="url(#gold2)" opacity="0.15"/>
    <polygon points="28,4 50,16 50,40 28,52 6,40 6,16"
             fill="none" stroke="url(#gold2)" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Letter S stylized -->
    <path d="M20 18 C20 14 24 12 28 12 C32 12 36 14 36 18 C36 22 32 24 28 26 C24 28 20 30 20 34 C20 38 24 40 28 40 C32 40 36 38 36 34"
          fill="none" stroke="url(#gold2)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Text: SagarBags -->
  <text x="78" y="48" font-family="Poppins, sans-serif" font-size="30" font-weight="600" fill="#ffffff">Sagar<tspan fill="url(#gold2)" font-weight="700">Bags</tspan></text>
</svg>
