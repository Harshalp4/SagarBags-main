<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80">
  <defs>
    <linearGradient id="gold18" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0d860"/>
      <stop offset="100%" style="stop-color:#c9a227"/>
    </linearGradient>
  </defs>

  <!-- Dark Background -->
  <rect width="340" height="80" rx="6" fill="#0a0a0a"/>

  <!-- Bag in Hexagon Frame -->
  <g transform="translate(10, 8)">
    <!-- Hexagon frame -->
    <polygon points="32,4 56,18 56,46 32,60 8,46 8,18"
             fill="url(#gold18)" opacity="0.1"/>
    <polygon points="32,4 56,18 56,46 32,60 8,46 8,18"
             fill="none" stroke="url(#gold18)" stroke-width="2"/>

    <!-- Bag inside -->
    <rect x="18" y="24" width="28" height="26" rx="3" fill="none" stroke="url(#gold18)" stroke-width="2"/>
    <path d="M24 24 L24 18 C24 14 28 12 32 12 C36 12 40 14 40 18 L40 24"
          fill="none" stroke="url(#gold18)" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Text: SagarBags -->
  <text x="78" y="50" font-family="Poppins, sans-serif" font-size="32" font-weight="600" fill="#ffffff">Sagar<tspan fill="url(#gold18)" font-weight="700">Bags</tspan></text>
</svg>
