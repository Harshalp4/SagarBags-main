<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80">
  <defs>
    <linearGradient id="gold20" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0d860"/>
      <stop offset="100%" style="stop-color:#c9a227"/>
    </linearGradient>
  </defs>

  <!-- Dark Background -->
  <rect width="340" height="80" rx="6" fill="#0a0a0a"/>

  <!-- Rounded Bucket Bag Style -->
  <g transform="translate(10, 8)">
    <!-- Bag Body - Bucket shape -->
    <path d="M12 26 L8 56 C8 60 18 64 32 64 C46 64 56 60 56 56 L52 26"
          fill="url(#gold20)" opacity="0.2"/>
    <path d="M12 26 L8 56 C8 60 18 64 32 64 C46 64 56 60 56 56 L52 26"
          fill="none" stroke="url(#gold20)" stroke-width="3"/>

    <!-- Top opening -->
    <ellipse cx="32" cy="26" rx="20" ry="6" fill="none" stroke="url(#gold20)" stroke-width="3"/>

    <!-- Handle strap going across -->
    <path d="M18 22 C18 10 32 6 32 6 C32 6 46 10 46 22"
          fill="none" stroke="url(#gold20)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Text: SagarBags -->
  <text x="78" y="50" font-family="Poppins, sans-serif" font-size="32" font-weight="600" fill="#ffffff">Sagar<tspan fill="url(#gold20)" font-weight="700">Bags</tspan></text>
</svg>
