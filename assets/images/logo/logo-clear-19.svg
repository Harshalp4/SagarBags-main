<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80">
  <defs>
    <linearGradient id="gold19" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0d860"/>
      <stop offset="100%" style="stop-color:#c9a227"/>
    </linearGradient>
  </defs>

  <!-- Dark Background -->
  <rect width="340" height="80" rx="6" fill="#0a0a0a"/>

  <!-- Bag with Price Tag -->
  <g transform="translate(10, 10)">
    <!-- Bag Body -->
    <rect x="8" y="22" width="44" height="38" rx="4" fill="url(#gold19)" opacity="0.2"/>
    <rect x="8" y="22" width="44" height="38" rx="4" fill="none" stroke="url(#gold19)" stroke-width="3"/>

    <!-- Handles -->
    <path d="M18 22 L18 12 C18 8 24 5 30 5 C36 5 42 8 42 12 L42 22"
          fill="none" stroke="url(#gold19)" stroke-width="3" stroke-linecap="round"/>

    <!-- Price Tag -->
    <g transform="translate(42, 18)">
      <path d="M0 0 L14 0 L20 6 L20 16 L6 16 L0 10 Z" fill="url(#gold19)"/>
      <circle cx="15" cy="6" r="2" fill="#0a0a0a"/>
    </g>
  </g>

  <!-- Text: SagarBags -->
  <text x="82" y="50" font-family="Poppins, sans-serif" font-size="32" font-weight="600" fill="#ffffff">Sagar<tspan fill="url(#gold19)" font-weight="700">Bags</tspan></text>
</svg>
