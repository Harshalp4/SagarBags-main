<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80">
  <defs>
    <linearGradient id="gold8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0d860"/>
      <stop offset="100%" style="stop-color:#c9a227"/>
    </linearGradient>
  </defs>

  <!-- Dark Background -->
  <rect width="340" height="80" rx="6" fill="#0a0a0a"/>

  <!-- SB Letters with Bag Shape -->
  <g transform="translate(8, 8)">
    <!-- Square Frame -->
    <rect x="6" y="6" width="56" height="56" rx="8" fill="url(#gold8)" opacity="0.1"/>
    <rect x="6" y="6" width="56" height="56" rx="8" fill="none" stroke="url(#gold8)" stroke-width="2"/>

    <!-- S Letter -->
    <text x="22" y="48" font-family="Poppins, sans-serif" font-size="36" font-weight="700" fill="url(#gold8)">S</text>

    <!-- B Letter slightly overlapping -->
    <text x="38" y="48" font-family="Poppins, sans-serif" font-size="36" font-weight="700" fill="#ffffff" opacity="0.9">B</text>
  </g>

  <!-- Text: SagarBags -->
  <text x="82" y="50" font-family="Poppins, sans-serif" font-size="32" font-weight="600" fill="#ffffff">Sagar<tspan fill="url(#gold8)" font-weight="700">Bags</tspan></text>
</svg>
