<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80">
  <defs>
    <linearGradient id="gold1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0d860"/>
      <stop offset="100%" style="stop-color:#c9a227"/>
    </linearGradient>
  </defs>

  <!-- Dark Background -->
  <rect width="340" height="80" rx="6" fill="#0a0a0a"/>

  <!-- Simple Shopping Bag - Very Clear -->
  <g transform="translate(15, 10)">
    <!-- Bag Body -->
    <rect x="8" y="24" width="44" height="36" rx="4" fill="url(#gold1)" opacity="0.2"/>
    <rect x="8" y="24" width="44" height="36" rx="4" fill="none" stroke="url(#gold1)" stroke-width="3"/>

    <!-- Handle - Simple Arc -->
    <path d="M18 24 L18 14 C18 8 24 5 30 5 C36 5 42 8 42 14 L42 24"
          fill="none" stroke="url(#gold1)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Text: SagarBags -->
  <text x="80" y="50" font-family="Poppins, sans-serif" font-size="32" font-weight="600" fill="#ffffff">Sagar<tspan fill="url(#gold1)" font-weight="700">Bags</tspan></text>
</svg>
