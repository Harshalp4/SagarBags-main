<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80">
  <defs>
    <linearGradient id="gold11" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0d860"/>
      <stop offset="100%" style="stop-color:#c9a227"/>
    </linearGradient>
  </defs>

  <!-- Dark Background -->
  <rect width="340" height="80" rx="6" fill="#0a0a0a"/>

  <!-- Duffle Bag / Gym Bag -->
  <g transform="translate(10, 12)">
    <!-- Bag Body - Rounded Rectangle -->
    <rect x="6" y="20" width="52" height="36" rx="18" fill="url(#gold11)" opacity="0.2"/>
    <rect x="6" y="20" width="52" height="36" rx="18" fill="none" stroke="url(#gold11)" stroke-width="3"/>

    <!-- Handle -->
    <path d="M20 20 L20 12 C20 8 27 6 32 6 C37 6 44 8 44 12 L44 20"
          fill="none" stroke="url(#gold11)" stroke-width="3" stroke-linecap="round"/>

    <!-- Zipper line -->
    <line x1="14" y1="38" x2="50" y2="38" stroke="url(#gold11)" stroke-width="2" stroke-dasharray="4,3"/>
  </g>

  <!-- Text: SagarBags -->
  <text x="78" y="50" font-family="Poppins, sans-serif" font-size="32" font-weight="600" fill="#ffffff">Sagar<tspan fill="url(#gold11)" font-weight="700">Bags</tspan></text>
</svg>
