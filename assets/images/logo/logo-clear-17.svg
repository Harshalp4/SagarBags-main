<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80">
  <defs>
    <linearGradient id="gold17" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0d860"/>
      <stop offset="100%" style="stop-color:#c9a227"/>
    </linearGradient>
  </defs>

  <!-- Dark Background -->
  <rect width="340" height="80" rx="6" fill="#0a0a0a"/>

  <!-- Shopping Bag with Star/Quality Mark -->
  <g transform="translate(12, 10)">
    <!-- Bag Body -->
    <rect x="8" y="22" width="44" height="40" rx="4" fill="url(#gold17)" opacity="0.2"/>
    <rect x="8" y="22" width="44" height="40" rx="4" fill="none" stroke="url(#gold17)" stroke-width="3"/>

    <!-- Handles -->
    <path d="M18 22 L18 12 C18 8 24 5 30 5 C36 5 42 8 42 12 L42 22"
          fill="none" stroke="url(#gold17)" stroke-width="3" stroke-linecap="round"/>

    <!-- Star in center -->
    <polygon points="30,32 32.5,37 38,38 34,42 35,48 30,45 25,48 26,42 22,38 27.5,37"
             fill="url(#gold17)"/>
  </g>

  <!-- Text: SagarBags -->
  <text x="78" y="50" font-family="Poppins, sans-serif" font-size="32" font-weight="600" fill="#ffffff">Sagar<tspan fill="url(#gold17)" font-weight="700">Bags</tspan></text>
</svg>
