<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80">
  <defs>
    <linearGradient id="gold12" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0d860"/>
      <stop offset="100%" style="stop-color:#c9a227"/>
    </linearGradient>
  </defs>

  <!-- Dark Background -->
  <rect width="340" height="80" rx="6" fill="#0a0a0a"/>

  <!-- Drawstring Bag / Pouch -->
  <g transform="translate(12, 10)">
    <!-- Bag Body -->
    <path d="M10 28 L10 52 C10 58 20 62 32 62 C44 62 54 58 54 52 L54 28"
          fill="url(#gold12)" opacity="0.2"/>
    <path d="M10 28 L10 52 C10 58 20 62 32 62 C44 62 54 58 54 52 L54 28"
          fill="none" stroke="url(#gold12)" stroke-width="3"/>

    <!-- Drawstring Top -->
    <ellipse cx="32" cy="28" rx="22" ry="8" fill="none" stroke="url(#gold12)" stroke-width="3"/>

    <!-- Drawstring cords -->
    <path d="M22 22 L22 10 M42 22 L42 10" stroke="url(#gold12)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="22" cy="8" r="3" fill="url(#gold12)"/>
    <circle cx="42" cy="8" r="3" fill="url(#gold12)"/>
  </g>

  <!-- Text: SagarBags -->
  <text x="82" y="50" font-family="Poppins, sans-serif" font-size="32" font-weight="600" fill="#ffffff">Sagar<tspan fill="url(#gold12)" font-weight="700">Bags</tspan></text>
</svg>
