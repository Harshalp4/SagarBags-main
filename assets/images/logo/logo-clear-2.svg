<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80">
  <defs>
    <linearGradient id="gold2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0d860"/>
      <stop offset="100%" style="stop-color:#c9a227"/>
    </linearGradient>
  </defs>

  <!-- Dark Background -->
  <rect width="340" height="80" rx="6" fill="#0a0a0a"/>

  <!-- Tote Bag - Simple & Clear -->
  <g transform="translate(12, 8)">
    <!-- Bag Body - Trapezoid -->
    <path d="M12 22 L6 60 C6 62 8 64 10 64 L50 64 C52 64 54 62 54 60 L48 22 Z"
          fill="url(#gold2)" opacity="0.2"/>
    <path d="M12 22 L6 60 C6 62 8 64 10 64 L50 64 C52 64 54 62 54 60 L48 22 Z"
          fill="none" stroke="url(#gold2)" stroke-width="3" stroke-linejoin="round"/>

    <!-- Two Handles -->
    <path d="M18 22 L18 12 C18 8 22 6 26 6"
          fill="none" stroke="url(#gold2)" stroke-width="3" stroke-linecap="round"/>
    <path d="M42 22 L42 12 C42 8 38 6 34 6"
          fill="none" stroke="url(#gold2)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Text: SagarBags -->
  <text x="80" y="50" font-family="Poppins, sans-serif" font-size="32" font-weight="600" fill="#ffffff">Sagar<tspan fill="url(#gold2)" font-weight="700">Bags</tspan></text>
</svg>
