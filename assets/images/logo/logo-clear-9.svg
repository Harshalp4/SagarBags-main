<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80">
  <defs>
    <linearGradient id="gold9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0d860"/>
      <stop offset="100%" style="stop-color:#c9a227"/>
    </linearGradient>
  </defs>

  <!-- Dark Background -->
  <rect width="340" height="80" rx="6" fill="#0a0a0a"/>

  <!-- Eco/Jute Bag Style -->
  <g transform="translate(10, 8)">
    <!-- Bag Body with rounded bottom -->
    <path d="M10 20 L10 52 C10 58 16 62 30 62 C44 62 50 58 50 52 L50 20 Z"
          fill="url(#gold9)" opacity="0.2"/>
    <path d="M10 20 L10 52 C10 58 16 62 30 62 C44 62 50 58 50 52 L50 20 Z"
          fill="none" stroke="url(#gold9)" stroke-width="3"/>

    <!-- Handles -->
    <path d="M18 20 L18 10 C18 6 24 4 30 4 C36 4 42 6 42 10 L42 20"
          fill="none" stroke="url(#gold9)" stroke-width="3" stroke-linecap="round"/>

    <!-- Leaf/Eco symbol -->
    <path d="M30 32 C30 32 24 38 24 44 C24 50 30 52 30 52 C30 52 36 50 36 44 C36 38 30 32 30 32"
          fill="none" stroke="url(#gold9)" stroke-width="2"/>
    <line x1="30" y1="38" x2="30" y2="50" stroke="url(#gold9)" stroke-width="1.5"/>
  </g>

  <!-- Text: SagarBags -->
  <text x="78" y="50" font-family="Poppins, sans-serif" font-size="32" font-weight="600" fill="#ffffff">Sagar<tspan fill="url(#gold9)" font-weight="700">Bags</tspan></text>
</svg>
