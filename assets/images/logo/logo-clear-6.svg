<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80">
  <defs>
    <linearGradient id="gold6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0d860"/>
      <stop offset="100%" style="stop-color:#c9a227"/>
    </linearGradient>
  </defs>

  <!-- Dark Background -->
  <rect width="340" height="80" rx="6" fill="#0a0a0a"/>

  <!-- Handbag / Purse Style -->
  <g transform="translate(10, 10)">
    <!-- Bag Body -->
    <rect x="8" y="26" width="48" height="34" rx="4" fill="url(#gold6)" opacity="0.2"/>
    <rect x="8" y="26" width="48" height="34" rx="4" fill="none" stroke="url(#gold6)" stroke-width="3"/>

    <!-- Single Curved Handle -->
    <path d="M16 26 C16 10 32 6 32 6 C32 6 48 10 48 26"
          fill="none" stroke="url(#gold6)" stroke-width="3" stroke-linecap="round"/>

    <!-- Clasp -->
    <circle cx="32" cy="36" r="5" fill="none" stroke="url(#gold6)" stroke-width="2"/>
    <circle cx="32" cy="36" r="2" fill="url(#gold6)"/>
  </g>

  <!-- Text: SagarBags -->
  <text x="80" y="50" font-family="Poppins, sans-serif" font-size="32" font-weight="600" fill="#ffffff">Sagar<tspan fill="url(#gold6)" font-weight="700">Bags</tspan></text>
</svg>
