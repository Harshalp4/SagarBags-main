<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="gold7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8c547"/>
      <stop offset="50%" style="stop-color:#c9a227"/>
      <stop offset="100%" style="stop-color:#a68b1f"/>
    </linearGradient>
  </defs>

  <!-- Dark Background -->
  <rect x="0" y="0" width="320" height="80" rx="8" fill="#0a0a0a"/>

  <!-- Backpack Style Icon -->
  <g transform="translate(10, 6)">
    <!-- Main bag body -->
    <rect x="12" y="20" width="40" height="42" rx="6"
          fill="url(#gold7)" opacity="0.15"/>
    <rect x="12" y="20" width="40" height="42" rx="6"
          fill="none" stroke="url(#gold7)" stroke-width="2.5"/>

    <!-- Top flap -->
    <path d="M12 28 L12 22 C12 18 16 15 22 15 L42 15 C48 15 52 18 52 22 L52 28"
          fill="none" stroke="url(#gold7)" stroke-width="2.5"/>

    <!-- Straps -->
    <path d="M18 15 L18 8 C18 5 22 3 32 3 C42 3 46 5 46 8 L46 15"
          fill="none" stroke="url(#gold7)" stroke-width="2" stroke-linecap="round"/>

    <!-- Front pocket -->
    <rect x="22" y="36" width="20" height="16" rx="3"
          fill="none" stroke="url(#gold7)" stroke-width="1.5"/>

    <!-- Zipper line -->
    <path d="M32 36 L32 52" stroke="url(#gold7)" stroke-width="1" stroke-dasharray="2,2"/>
  </g>

  <!-- Text: SagarBags -->
  <text x="78" y="48" font-family="Poppins, sans-serif" font-size="30" font-weight="600" fill="#ffffff">Sagar<tspan fill="url(#gold7)" font-weight="700">Bags</tspan></text>
</svg>
