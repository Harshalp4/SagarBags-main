<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80">
  <defs>
    <linearGradient id="gold3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0d860"/>
      <stop offset="100%" style="stop-color:#c9a227"/>
    </linearGradient>
  </defs>

  <!-- Dark Background -->
  <rect width="340" height="80" rx="6" fill="#0a0a0a"/>

  <!-- Backpack - Clear Icon -->
  <g transform="translate(12, 6)">
    <!-- Main Body -->
    <rect x="10" y="20" width="40" height="48" rx="6" fill="url(#gold3)" opacity="0.2"/>
    <rect x="10" y="20" width="40" height="48" rx="6" fill="none" stroke="url(#gold3)" stroke-width="3"/>

    <!-- Top Flap -->
    <path d="M10 28 C10 20 18 14 30 14 C42 14 50 20 50 28"
          fill="none" stroke="url(#gold3)" stroke-width="3"/>

    <!-- Straps on top -->
    <path d="M22 14 L22 6 M38 14 L38 6"
          stroke="url(#gold3)" stroke-width="3" stroke-linecap="round"/>

    <!-- Front Pocket -->
    <rect x="18" y="38" width="24" height="18" rx="3" fill="none" stroke="url(#gold3)" stroke-width="2"/>
  </g>

  <!-- Text: SagarBags -->
  <text x="78" y="50" font-family="Poppins, sans-serif" font-size="32" font-weight="600" fill="#ffffff">Sagar<tspan fill="url(#gold3)" font-weight="700">Bags</tspan></text>
</svg>
