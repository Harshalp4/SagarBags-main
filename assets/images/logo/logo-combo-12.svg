<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80">
  <defs>
    <linearGradient id="goldC12" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0d860"/>
      <stop offset="100%" style="stop-color:#c9a227"/>
    </linearGradient>
  </defs>

  <!-- Dark Background -->
  <rect width="340" height="80" rx="6" fill="#0a0a0a"/>

  <!-- Combo 12: Briefcase with crown (premium) -->
  <g transform="translate(8, 6)">
    <!-- Crown on top -->
    <path d="M18 18 L22 8 L28 14 L34 4 L40 14 L46 8 L50 18"
          fill="none" stroke="url(#goldC12)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="22" cy="6" r="2" fill="url(#goldC12)"/>
    <circle cx="34" cy="2" r="2.5" fill="url(#goldC12)"/>
    <circle cx="46" cy="6" r="2" fill="url(#goldC12)"/>

    <!-- Main briefcase -->
    <rect x="12" y="22" width="44" height="32" rx="4" fill="url(#goldC12)" opacity="0.2"/>
    <rect x="12" y="22" width="44" height="32" rx="4" fill="none" stroke="url(#goldC12)" stroke-width="3"/>
    <path d="M24 22 L24 18 L44 18 L44 22" fill="none" stroke="url(#goldC12)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="18" y1="40" x2="50" y2="40" stroke="url(#goldC12)" stroke-width="2"/>
    <circle cx="32" cy="40" r="2.5" fill="url(#goldC12)"/>
    <circle cx="38" cy="40" r="2.5" fill="url(#goldC12)"/>

    <!-- Premium badge -->
    <rect x="28" y="46" width="12" height="5" rx="2" fill="url(#goldC12)" opacity="0.5"/>
  </g>

  <!-- Text: SagarBags -->
  <text x="78" y="50" font-family="Poppins, sans-serif" font-size="32" font-weight="600" fill="#ffffff">Sagar<tspan fill="url(#goldC12)" font-weight="700">Bags</tspan></text>
</svg>
