<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80">
  <defs>
    <linearGradient id="goldC5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0d860"/>
      <stop offset="100%" style="stop-color:#c9a227"/>
    </linearGradient>
  </defs>

  <!-- Dark Background -->
  <rect width="340" height="80" rx="6" fill="#0a0a0a"/>

  <!-- Combo 5: Briefcase with overlapping shopping bag (C-16 style but with briefcase) -->
  <g transform="translate(6, 8)">
    <!-- Back: Taller shopping bag -->
    <rect x="32" y="12" width="30" height="44" rx="3" fill="url(#goldC5)" opacity="0.1"/>
    <rect x="32" y="12" width="30" height="44" rx="3" fill="none" stroke="url(#goldC5)" stroke-width="2"/>
    <path d="M40 12 L40 4 C40 0 44 -2 47 -2 C50 -2 54 0 54 4 L54 12" fill="none" stroke="url(#goldC5)" stroke-width="2" stroke-linecap="round"/>

    <!-- Front: Wide briefcase -->
    <rect x="2" y="22" width="48" height="34" rx="4" fill="url(#goldC5)" opacity="0.25"/>
    <rect x="2" y="22" width="48" height="34" rx="4" fill="none" stroke="url(#goldC5)" stroke-width="3"/>
    <path d="M16 22 L16 14 L36 14 L36 22" fill="none" stroke="url(#goldC5)" stroke-width="3" stroke-linecap="round"/>
    <line x1="8" y1="40" x2="44" y2="40" stroke="url(#goldC5)" stroke-width="2"/>
    <circle cx="22" cy="40" r="2.5" fill="url(#goldC5)"/>
    <circle cx="30" cy="40" r="2.5" fill="url(#goldC5)"/>

    <!-- Clasp detail -->
    <rect x="20" y="48" width="12" height="4" rx="2" fill="url(#goldC5)" opacity="0.5"/>
  </g>

  <!-- Text: SagarBags -->
  <text x="82" y="50" font-family="Poppins, sans-serif" font-size="32" font-weight="600" fill="#ffffff">Sagar<tspan fill="url(#goldC5)" font-weight="700">Bags</tspan></text>
</svg>
