<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80">
  <defs>
    <linearGradient id="gold14" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0d860"/>
      <stop offset="100%" style="stop-color:#c9a227"/>
    </linearGradient>
  </defs>

  <!-- Dark Background -->
  <rect width="340" height="80" rx="6" fill="#0a0a0a"/>

  <!-- Laptop / Document Bag -->
  <g transform="translate(10, 14)">
    <!-- Bag Body - Rectangular briefcase -->
    <rect x="6" y="18" width="52" height="38" rx="4" fill="url(#gold14)" opacity="0.2"/>
    <rect x="6" y="18" width="52" height="38" rx="4" fill="none" stroke="url(#gold14)" stroke-width="3"/>

    <!-- Handle -->
    <path d="M22 18 L22 10 L42 10 L42 18" fill="none" stroke="url(#gold14)" stroke-width="3" stroke-linecap="round"/>

    <!-- Front pocket line -->
    <line x1="12" y1="40" x2="52" y2="40" stroke="url(#gold14)" stroke-width="2"/>

    <!-- Zipper pulls -->
    <circle cx="28" cy="40" r="2" fill="url(#gold14)"/>
    <circle cx="36" cy="40" r="2" fill="url(#gold14)"/>
  </g>

  <!-- Text: SagarBags -->
  <text x="78" y="50" font-family="Poppins, sans-serif" font-size="32" font-weight="600" fill="#ffffff">Sagar<tspan fill="url(#gold14)" font-weight="700">Bags</tspan></text>
</svg>
