<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80">
  <defs>
    <linearGradient id="goldC10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0d860"/>
      <stop offset="100%" style="stop-color:#c9a227"/>
    </linearGradient>
  </defs>

  <!-- Dark Background -->
  <rect width="340" height="80" rx="6" fill="#0a0a0a"/>

  <!-- Combo 10: Diamond arrangement -->
  <g transform="translate(8, 8)">
    <!-- Center diamond shape made of bags -->
    <!-- Top mini bag -->
    <rect x="24" y="2" width="16" height="14" rx="2" fill="url(#goldC10)" opacity="0.15"/>
    <rect x="24" y="2" width="16" height="14" rx="2" fill="none" stroke="url(#goldC10)" stroke-width="1.5"/>
    <path d="M28 2 L28 -1 L36 -1 L36 2" fill="none" stroke="url(#goldC10)" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Center briefcase (main) -->
    <rect x="10" y="20" width="44" height="30" rx="4" fill="url(#goldC10)" opacity="0.25"/>
    <rect x="10" y="20" width="44" height="30" rx="4" fill="none" stroke="url(#goldC10)" stroke-width="3"/>
    <path d="M22 20 L22 12 L42 12 L42 20" fill="none" stroke="url(#goldC10)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="16" y1="36" x2="48" y2="36" stroke="url(#goldC10)" stroke-width="2"/>
    <circle cx="28" cy="36" r="2" fill="url(#goldC10)"/>
    <circle cx="36" cy="36" r="2" fill="url(#goldC10)"/>

    <!-- Bottom mini bag -->
    <rect x="24" y="52" width="16" height="12" rx="2" fill="url(#goldC10)" opacity="0.15"/>
    <rect x="24" y="52" width="16" height="12" rx="2" fill="none" stroke="url(#goldC10)" stroke-width="1.5"/>
  </g>

  <!-- Text: SagarBags -->
  <text x="78" y="50" font-family="Poppins, sans-serif" font-size="32" font-weight="600" fill="#ffffff">Sagar<tspan fill="url(#goldC10)" font-weight="700">Bags</tspan></text>
</svg>
