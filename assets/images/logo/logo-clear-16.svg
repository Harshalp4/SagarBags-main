<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80">
  <defs>
    <linearGradient id="gold16" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0d860"/>
      <stop offset="100%" style="stop-color:#c9a227"/>
    </linearGradient>
  </defs>

  <!-- Dark Background -->
  <rect width="340" height="80" rx="6" fill="#0a0a0a"/>

  <!-- Two Bags Together -->
  <g transform="translate(8, 12)">
    <!-- Back bag (smaller) -->
    <rect x="28" y="20" width="32" height="38" rx="3" fill="url(#gold16)" opacity="0.15"/>
    <rect x="28" y="20" width="32" height="38" rx="3" fill="none" stroke="url(#gold16)" stroke-width="2"/>
    <path d="M36 20 L36 14 C36 10 40 8 44 8 C48 8 52 10 52 14 L52 20"
          fill="none" stroke="url(#gold16)" stroke-width="2" stroke-linecap="round"/>

    <!-- Front bag (larger) -->
    <rect x="6" y="24" width="36" height="40" rx="3" fill="url(#gold16)" opacity="0.2"/>
    <rect x="6" y="24" width="36" height="40" rx="3" fill="none" stroke="url(#gold16)" stroke-width="3"/>
    <path d="M16 24 L16 14 C16 8 20 5 24 5 C28 5 32 8 32 14 L32 24"
          fill="none" stroke="url(#gold16)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Text: SagarBags -->
  <text x="82" y="50" font-family="Poppins, sans-serif" font-size="32" font-weight="600" fill="#ffffff">Sagar<tspan fill="url(#gold16)" font-weight="700">Bags</tspan></text>
</svg>
