<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="gold3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8c547"/>
      <stop offset="50%" style="stop-color:#c9a227"/>
      <stop offset="100%" style="stop-color:#a68b1f"/>
    </linearGradient>
  </defs>

  <!-- Dark Background -->
  <rect x="0" y="0" width="320" height="80" rx="8" fill="#0a0a0a"/>

  <!-- Crown/Premium Badge -->
  <g transform="translate(10, 10)">
    <!-- Shield Shape -->
    <path d="M28 5 L50 12 L50 38 C50 48 28 58 28 58 C28 58 6 48 6 38 L6 12 Z"
          fill="url(#gold3)" opacity="0.15"/>
    <path d="M28 5 L50 12 L50 38 C50 48 28 58 28 58 C28 58 6 48 6 38 L6 12 Z"
          fill="none" stroke="url(#gold3)" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Crown on top -->
    <path d="M18 8 L21 3 L28 7 L35 3 L38 8"
          fill="none" stroke="url(#gold3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- SB Text inside -->
    <text x="28" y="32" font-family="Poppins, sans-serif" font-size="14" font-weight="700" fill="url(#gold3)" text-anchor="middle">SB</text>

    <!-- Star below -->
    <polygon points="28,42 30,46 34,46 31,49 32,53 28,50 24,53 25,49 22,46 26,46"
             fill="url(#gold3)" opacity="0.8"/>
  </g>

  <!-- Text: SagarBags -->
  <text x="75" y="48" font-family="Poppins, sans-serif" font-size="30" font-weight="600" fill="#ffffff">Sagar<tspan fill="url(#gold3)" font-weight="700">Bags</tspan></text>
</svg>
