<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="gold4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8c547"/>
      <stop offset="50%" style="stop-color:#c9a227"/>
      <stop offset="100%" style="stop-color:#a68b1f"/>
    </linearGradient>
  </defs>

  <!-- Dark Background -->
  <rect x="0" y="0" width="320" height="80" rx="8" fill="#0a0a0a"/>

  <!-- Intertwined SB Monogram -->
  <g transform="translate(10, 8)">
    <!-- Outer Circle -->
    <circle cx="32" cy="32" r="28" fill="none" stroke="url(#gold4)" stroke-width="2"/>

    <!-- Inner decorative circle -->
    <circle cx="32" cy="32" r="22" fill="url(#gold4)" opacity="0.1"/>

    <!-- Stylized S -->
    <path d="M24 20 C24 16 28 14 32 14 C36 14 40 16 40 20 C40 24 36 26 32 28 C28 30 24 32 24 36 C24 40 28 42 32 42"
          fill="none" stroke="url(#gold4)" stroke-width="3.5" stroke-linecap="round"/>

    <!-- B integrated -->
    <path d="M32 42 C36 42 40 40 40 36 C40 33 37 31 34 31"
          fill="none" stroke="url(#gold4)" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Decorative dots -->
    <circle cx="20" cy="32" r="2" fill="url(#gold4)"/>
    <circle cx="44" cy="32" r="2" fill="url(#gold4)"/>
  </g>

  <!-- Text: SagarBags -->
  <text x="80" y="48" font-family="Poppins, sans-serif" font-size="30" font-weight="600" fill="#ffffff">Sagar<tspan fill="url(#gold4)" font-weight="700">Bags</tspan></text>
</svg>
