<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60">
  <defs>
    <linearGradient id="goldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8c547"/>
      <stop offset="50%" style="stop-color:#c9a227"/>
      <stop offset="100%" style="stop-color:#a68b1f"/>
    </linearGradient>
  </defs>

  <!-- Bag Icon - Minimalist Shopping Bag -->
  <g transform="translate(5, 5)">
    <!-- Bag Body -->
    <path d="M8 18 L8 45 C8 47 9 48 11 48 L39 48 C41 48 42 47 42 45 L42 18 Z"
          fill="none" stroke="url(#goldGrad1)" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Bag Handle -->
    <path d="M16 18 L16 12 C16 6 20 3 25 3 C30 3 34 6 34 12 L34 18"
          fill="none" stroke="url(#goldGrad1)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Decorative fold line -->
    <path d="M12 24 L38 24" stroke="url(#goldGrad1)" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Text: Sagar -->
  <text x="60" y="38" font-family="Poppins, sans-serif" font-size="28" font-weight="600" fill="#ffffff">Sagar</text>

  <!-- Text: Bags -->
  <text x="152" y="38" font-family="Poppins, sans-serif" font-size="28" font-weight="700" fill="url(#goldGrad1)">Bags</text>
</svg>
