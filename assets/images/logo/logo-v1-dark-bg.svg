<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="gold1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8c547"/>
      <stop offset="50%" style="stop-color:#c9a227"/>
      <stop offset="100%" style="stop-color:#a68b1f"/>
    </linearGradient>
  </defs>

  <!-- Dark Background -->
  <rect x="0" y="0" width="320" height="80" rx="8" fill="#0a0a0a"/>

  <!-- Elegant Bag with Ribbon/Bow -->
  <g transform="translate(15, 12)">
    <!-- Bag Body -->
    <path d="M8 24 L5 52 C5 54 6 55 8 55 L48 55 C50 55 51 54 51 52 L48 24 Z"
          fill="url(#gold1)" opacity="0.2"/>
    <path d="M8 24 L5 52 C5 54 6 55 8 55 L48 55 C50 55 51 54 51 52 L48 24 Z"
          fill="none" stroke="url(#gold1)" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Handle -->
    <path d="M18 24 L18 14 C18 7 23 4 28 4 C33 4 38 7 38 14 L38 24"
          fill="none" stroke="url(#gold1)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Ribbon/Bow decoration -->
    <ellipse cx="28" cy="32" rx="8" ry="4" fill="none" stroke="url(#gold1)" stroke-width="1.5"/>
    <path d="M20 32 L14 28 M20 32 L14 36 M36 32 L42 28 M36 32 L42 36"
          stroke="url(#gold1)" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Text: SagarBags -->
  <text x="80" y="48" font-family="Poppins, sans-serif" font-size="30" font-weight="600" fill="#ffffff">Sagar<tspan fill="url(#gold1)" font-weight="700">Bags</tspan></text>
</svg>
