<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80">
  <defs>
    <linearGradient id="gold4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0d860"/>
      <stop offset="100%" style="stop-color:#c9a227"/>
    </linearGradient>
  </defs>

  <!-- Dark Background -->
  <rect width="340" height="80" rx="6" fill="#0a0a0a"/>

  <!-- Paper Shopping Bag - Classic Style -->
  <g transform="translate(12, 8)">
    <!-- Bag Body -->
    <path d="M8 20 L8 58 C8 61 10 63 13 63 L47 63 C50 63 52 61 52 58 L52 20 Z"
          fill="url(#gold4)" opacity="0.2"/>
    <path d="M8 20 L8 58 C8 61 10 63 13 63 L47 63 C50 63 52 61 52 58 L52 20 Z"
          fill="none" stroke="url(#gold4)" stroke-width="3"/>

    <!-- Folded Top -->
    <path d="M8 20 L8 26 L52 26 L52 20" fill="none" stroke="url(#gold4)" stroke-width="2"/>

    <!-- Rope Handles -->
    <ellipse cx="22" cy="14" rx="6" ry="8" fill="none" stroke="url(#gold4)" stroke-width="2.5"/>
    <ellipse cx="38" cy="14" rx="6" ry="8" fill="none" stroke="url(#gold4)" stroke-width="2.5"/>

    <!-- S letter on bag -->
    <text x="30" y="48" font-family="Poppins, sans-serif" font-size="22" font-weight="700" fill="url(#gold4)" text-anchor="middle">S</text>
  </g>

  <!-- Text: SagarBags -->
  <text x="80" y="50" font-family="Poppins, sans-serif" font-size="32" font-weight="600" fill="#ffffff">Sagar<tspan fill="url(#gold4)" font-weight="700">Bags</tspan></text>
</svg>
