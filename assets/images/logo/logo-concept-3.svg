<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60">
  <defs>
    <linearGradient id="goldGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8c547"/>
      <stop offset="50%" style="stop-color:#c9a227"/>
      <stop offset="100%" style="stop-color:#a68b1f"/>
    </linearGradient>
  </defs>

  <!-- Premium Tote Bag with Handle -->
  <g transform="translate(3, 3)">
    <!-- Bag Body - Trapezoid shape -->
    <path d="M10 20 L6 50 C6 52 7 53 9 53 L41 53 C43 53 44 52 44 50 L40 20 Z"
          fill="url(#goldGrad3)" opacity="0.15"/>
    <path d="M10 20 L6 50 C6 52 7 53 9 53 L41 53 C43 53 44 52 44 50 L40 20 Z"
          fill="none" stroke="url(#goldGrad3)" stroke-width="2" stroke-linejoin="round"/>

    <!-- Handle - Elegant curved -->
    <path d="M15 20 C15 8 25 4 25 4 C25 4 35 8 35 20"
          fill="none" stroke="url(#goldGrad3)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- S letter on bag -->
    <text x="19" y="42" font-family="Poppins, sans-serif" font-size="18" font-weight="700" fill="url(#goldGrad3)">S</text>
  </g>

  <!-- Text: Sagar -->
  <text x="58" y="38" font-family="Poppins, sans-serif" font-size="28" font-weight="600" fill="#ffffff">Sagar</text>

  <!-- Text: Bags -->
  <text x="150" y="38" font-family="Poppins, sans-serif" font-size="28" font-weight="700" fill="url(#goldGrad3)">Bags</text>
</svg>
