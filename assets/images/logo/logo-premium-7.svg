<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 90" width="360" height="90">
  <defs>
    <linearGradient id="goldPremium7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fcefc7"/>
      <stop offset="40%" style="stop-color:#d4af37"/>
      <stop offset="100%" style="stop-color:#aa8c2c"/>
    </linearGradient>
  </defs>

  <!-- Dark Background -->
  <rect x="0" y="0" width="360" height="90" rx="6" fill="#0a0a0a"/>

  <!-- THE CONCEPT: Royal Emblem - Lion/Crown heritage style -->
  <g transform="translate(10, 6)">
    <!-- Ornate frame -->
    <ellipse cx="38" cy="40" rx="32" ry="36" fill="none" stroke="url(#goldPremium7)" stroke-width="2"/>
    <ellipse cx="38" cy="40" rx="26" ry="30" fill="none" stroke="url(#goldPremium7)" stroke-width="1" opacity="0.5"/>

    <!-- Crown on top -->
    <path d="M24 12 L28 6 L33 10 L38 4 L43 10 L48 6 L52 12"
          fill="none" stroke="url(#goldPremium7)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M26 12 L50 12" stroke="url(#goldPremium7)" stroke-width="2"/>

    <!-- Stylized bag with handle inside -->
    <path d="M26 50 L26 38 C26 30 32 26 38 26 C44 26 50 30 50 38 L50 50"
          fill="none" stroke="url(#goldPremium7)" stroke-width="3" stroke-linecap="round"/>
    <path d="M24 50 L52 50 L50 62 L26 62 Z"
          fill="url(#goldPremium7)" opacity="0.2"/>
    <path d="M24 50 L52 50 L50 62 L26 62 Z"
          fill="none" stroke="url(#goldPremium7)" stroke-width="2"/>

    <!-- Laurel leaves on sides -->
    <path d="M8 30 C4 35 4 45 8 50" fill="none" stroke="url(#goldPremium7)" stroke-width="1.5" opacity="0.6"/>
    <path d="M68 30 C72 35 72 45 68 50" fill="none" stroke="url(#goldPremium7)" stroke-width="1.5" opacity="0.6"/>

    <!-- Year ribbon at bottom -->
    <path d="M20 68 L56 68" stroke="url(#goldPremium7)" stroke-width="1"/>
    <text x="38" y="78" font-family="Poppins, sans-serif" font-size="8" fill="url(#goldPremium7)" text-anchor="middle" letter-spacing="2">2004</text>
  </g>

  <!-- Text -->
  <text x="95" y="48" font-family="Poppins, sans-serif" font-size="34" font-weight="600" fill="#ffffff">Sagar<tspan fill="url(#goldPremium7)" font-weight="700">Bags</tspan></text>

  <!-- Heritage tagline -->
  <text x="97" y="68" font-family="Poppins, sans-serif" font-size="8" fill="#777" letter-spacing="2">SECOND GENERATION EXCELLENCE</text>
</svg>
