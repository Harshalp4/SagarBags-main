<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldIcon2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8c547"/>
      <stop offset="50%" style="stop-color:#c9a227"/>
      <stop offset="100%" style="stop-color:#a68b1f"/>
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="32" cy="32" r="30" fill="#0a0a0a"/>

  <!-- Circle Border -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="url(#goldIcon2)" stroke-width="2"/>

  <!-- SB Monogram -->
  <text x="32" y="30" font-family="Poppins, Arial, sans-serif" font-size="16" font-weight="700" fill="url(#goldIcon2)" text-anchor="middle">S</text>
  <text x="32" y="46" font-family="Poppins, Arial, sans-serif" font-size="16" font-weight="700" fill="url(#goldIcon2)" text-anchor="middle">B</text>
</svg>
