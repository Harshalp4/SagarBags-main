<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60">
  <defs>
    <linearGradient id="goldGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8c547"/>
      <stop offset="50%" style="stop-color:#c9a227"/>
      <stop offset="100%" style="stop-color:#a68b1f"/>
    </linearGradient>
  </defs>

  <!-- Abstract Bag Handle forming S shape -->
  <g transform="translate(5, 5)">
    <!-- Outer handle curve - forms S -->
    <path d="M35 8 C45 8 48 15 48 22 C48 32 38 35 28 35 C18 35 8 38 8 45 C8 50 15 52 22 52"
          fill="none" stroke="url(#goldGrad5)" stroke-width="3" stroke-linecap="round"/>

    <!-- Inner decorative line -->
    <path d="M30 14 C38 14 40 18 40 23 C40 30 33 32 26 32"
          fill="none" stroke="url(#goldGrad5)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

    <!-- Bag base hint -->
    <path d="M15 48 L28 48"
          fill="none" stroke="url(#goldGrad5)" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Text: Sagar -->
  <text x="62" y="38" font-family="Poppins, sans-serif" font-size="28" font-weight="600" fill="#ffffff">Sagar</text>

  <!-- Text: Bags -->
  <text x="154" y="38" font-family="Poppins, sans-serif" font-size="28" font-weight="700" fill="url(#goldGrad5)">Bags</text>
</svg>
