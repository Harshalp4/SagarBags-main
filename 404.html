<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Page not found - Sagar Bags">
  <title>404 - Page Not Found | Sagar Bags</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/logo/favicon.svg">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/responsive.css">

  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #0a0a0a 0%, #111 100%);
      padding: 2rem;
      text-align: center;
    }

    .error-content {
      max-width: 600px;
    }

    .error-code {
      font-size: clamp(6rem, 20vw, 12rem);
      font-weight: 700;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #f0d860 0%, #c9a227 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 1rem;
    }

    .error-title {
      font-size: clamp(1.5rem, 4vw, 2rem);
      font-weight: 600;
      color: #fff;
      margin-bottom: 1rem;
      font-family: 'Poppins', sans-serif;
    }

    .error-message {
      font-size: 1rem;
      color: #888;
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    .error-icon {
      width: 120px;
      height: 120px;
      margin: 0 auto 2rem;
      opacity: 0.8;
    }

    .error-icon svg {
      width: 100%;
      height: 100%;
    }

    .error-actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .error-actions .btn {
      min-width: 160px;
    }

    .error-links {
      margin-top: 3rem;
      padding-top: 2rem;
      border-top: 1px solid #222;
    }

    .error-links h4 {
      color: #888;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .error-links-list {
      display: flex;
      gap: 2rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .error-links-list a {
      color: #c9a227;
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.3s ease;
    }

    .error-links-list a:hover {
      color: #f0d860;
    }

    @media (max-width: 480px) {
      .error-actions {
        flex-direction: column;
      }

      .error-links-list {
        flex-direction: column;
        gap: 1rem;
      }
    }
  </style>
</head>
<body>
  <main class="error-page">
    <div class="error-content">
      <!-- Bag Icon -->
      <div class="error-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
          <defs>
            <linearGradient id="gold404" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#f0d860"/>
              <stop offset="100%" style="stop-color:#c9a227"/>
            </linearGradient>
          </defs>
          <!-- Empty bag icon -->
          <rect x="20" y="35" width="60" height="50" rx="6" stroke="url(#gold404)" stroke-width="3" fill="none"/>
          <path d="M35 35 L35 25 C35 18 42 12 50 12 C58 12 65 18 65 25 L65 35" stroke="url(#gold404)" stroke-width="3" stroke-linecap="round" fill="none"/>
          <!-- Question mark inside -->
          <text x="50" y="70" text-anchor="middle" fill="url(#gold404)" font-size="28" font-weight="bold" font-family="Poppins, sans-serif">?</text>
        </svg>
      </div>

      <div class="error-code">404</div>
      <h1 class="error-title">Page Not Found</h1>
      <p class="error-message">
        Oops! The page you're looking for seems to have wandered off.
        It might have been moved, deleted, or perhaps the URL was typed incorrectly.
      </p>

      <div class="error-actions">
        <a href="index.html" class="btn btn-primary">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="margin-right: 8px;">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
          </svg>
          Go Home
        </a>
        <a href="products.html" class="btn btn-outline">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="margin-right: 8px;">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
          </svg>
          View Products
        </a>
      </div>

      <div class="error-links">
        <h4>Quick Links</h4>
        <div class="error-links-list">
          <a href="index.html">Home</a>
          <a href="products.html">Products</a>
          <a href="about.html">About Us</a>
          <a href="contact.html">Contact Us</a>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
